version: "3.9"

services:
  dashboard:
    build: .
    container_name: retail-dashboard

    ports:
      - "8501:8501"

    volumes:
      - .:/app

    restart: unless-stopped

  api:
    build: .
    container_name: retail-api

    command: uvicorn api.main:app --host 0.0.0.0 --port 8000

    ports:
      - "8001:8000"

    volumes:
      - .:/app

    restart: unless-stopped