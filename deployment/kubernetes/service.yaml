apiVersion: v1
kind: Service
metadata:
  name: retail-api-service
spec:
  selector:
    app: retail-api
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: retail-dashboard-service
spec:
  selector:
    app: retail-dashboard
  ports:
    - protocol: TCP
      port: 8501
      targetPort: 8501
      nodePort: 30001
  type: NodePort